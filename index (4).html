<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algo Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #f5f5f5;
    --gold: #d4af37;
    --gold-light: #f6e08a;
    --gold-dark: #a67c00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  /* Photo on top (circle) */
  .photo {
    width: 160px;
    height: 160px;
    margin: 28px auto 18px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 3px solid var(--gold);
    box-shadow: 0 0 24px rgba(212,175,55,.45);
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  /* Channel name */
  .name {
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
        background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-dark));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--gold);
  }

  /* Text in the middle */
  .points {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding: 12px 24px;
    list-style: none;
  }
  .points li {
    position: relative;
    padding-left: 34px;
    font-size: 19px;
    line-height: 1.45;
    font-weight: 500;
  }
  .points li::before {
    content: "✓";
    position: absolute;
    left: 0;
    top: 1px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--gold);
    color: #000;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .points li:last-child { color: var(--gold-light); font-weight: 600; }

  /* Button at the bottom */
  .cta-wrap { padding: 16px 20px 8px; }
  .cta {
    position: relative;
    overflow: hidden;
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    color: #000;
    padding: 20px 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
    border: 2px solid var(--gold-light);
    box-shadow: 0 0 0 0 rgba(212,175,55,.6), 0 8px 24px rgba(212,175,55,.35);
    animation: pulse 1.8s infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .cta::before {
    content: "";
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-20deg);
    animation: shine 3s infinite;
  }
  .cta:active { transform: scale(.97); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(212,175,55,.55), 0 8px 24px rgba(212,175,55,.35); }
    70%  { box-shadow: 0 0 0 16px rgba(212,175,55,0), 0 8px 24px rgba(212,175,55,.35); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0), 0 8px 24px rgba(212,175,55,.35); }
  }
  @keyframes shine {
    0%, 60% { left: -80%; }
    100%    { left: 130%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cta, .cta::before { animation: none; }
  }
</style>
</head>
